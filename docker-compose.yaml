version: '3.9'

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_ROLE: root
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: postgrsql-nest
    ports:
      - '5432:5432'

  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data:
